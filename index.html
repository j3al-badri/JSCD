const aboutContents={en:`<h3>About the project</h3><p><b>Jalal Smart Car Diagnostic (JSCD)</b> is a single-file HTML/JavaScript educational prototype for preliminary diagnosis of passenger cars with combustion, hybrid and electric powertrains. It provides guided selection of systems and parts, reference images, optional microphone/camera/motion measurements, rule-based hypotheses, safe verification advice and links to external repair information.</p><p>This version is <b>not connected to a paid or general-purpose AI engine</b>. AI functionality may be integrated later, potentially requiring external computing resources or a subscription. It is not a certified vehicle diagnostic instrument and does not replace a qualified technician.</p><p><b>Designer:</b> Jalal Albadri<br><b>Contact:</b> jalal.al.badri26@gmail.com<br><b>Date:</b> October 2026</p>`,ar:`<h3>حول المشروع</h3><p><b>نظام جلال الذكي لتشخيص أعطال السيارات (JSCD)</b> نموذج تعليمي هندسي أولي يعمل بملف HTML وJavaScript واحد. يختص بالسيارات الشخصية الأحفورية والهجينة والكهربائية. يتيح اختيار الأنظمة والأجزاء، وتصفح الصور المرجعية، وإجراء قياسات اختيارية بالصوت والكاميرا والحركة، وعرض فرضيات الأعطال وطرق التحقق الآمن وروابط الإصلاح.</p><p><b>البرنامج غير مرتبط حالياً بمحرك ذكاء اصطناعي مدفوع أو عام</b>. يمكن ربطه وتطويره في المستقبل بتقنيات الذكاء الاصطناعي، وقد يحتاج ذلك إلى موارد حوسبة أو اشتراك. نتائجه أولية وليست بديلاً عن تشخيص فني متخصص.</p><p><b>المصمم:</b> جلال البدري<br><b>البريد الإلكتروني:</b> jalal.al.badri26@gmail.com<br><b>التاريخ:</b> أكتوبر 2026</p>`,fa:`<h3>درباره پروژه</h3><p><b>سامانه تشخیص عیب خودروی جلال (JSCD)</b> نمونه اولیه آموزشی مهندسی در یک فایل HTML و JavaScript است. برای خودروهای سواری احتراقی، هیبریدی و برقی طراحی شده و انتخاب سامانه و قطعه، تصاویر مرجع، داده‌های اختیاری صدا، دوربین و حرکت، عیب‌های احتمالی، بررسی ایمن و پیوندهای تعمیر را ارائه می‌دهد.</p><p>این برنامه <b>فعلاً به موتور هوش مصنوعی پولی یا عمومی متصل نیست</b>. در آینده امکان گسترش و اتصال به سامانه هوش مصنوعی وجود دارد که ممکن است به منابع پردازشی یا اشتراک نیاز داشته باشد. نتایج مقدماتی‌اند و جایگزین نظر تعمیرکار متخصص نیستند.</p><p><b>طراح:</b> جلال بدرى<br><b>ایمیل:</b> jalal.al.badri26@gmail.com<br><b>تاریخ:</b> اکتبر ۲۰۲۶</p>`,fi:`<h3>Tietoja hankkeesta</h3><p><b>Jalal Smart Car Diagnostic (JSCD)</b> on yhdessä HTML/JavaScript-tiedostossa toimiva tekninen opetus- ja prototyyppisovellus polttomoottori-, hybridi- ja sähköhenkilöautojen alustavaan vianmääritykseen. Se tarjoaa järjestelmien ja osien valinnan, vertailukuvia, valinnaisia ääni-, kamera- ja liikehavaintoja, sääntöpohjaisia vikavaihtoehtoja, turvallisuusohjeita ja korjaushakulinkkejä.</p><p>Ohjelma <b>ei tällä hetkellä ole yhteydessä maksulliseen tai yleiskäyttöiseen tekoälymalliin</b>. Tekoälyominaisuuksia voidaan myöhemmin kehittää; ne saattavat edellyttää lisälaskentaa tai tilausta. Tulokset ovat alustavia eivätkä korvaa ammattitaitoista huoltoa.</p><p><b>Suunnittelija:</b> Jalal Albadri<br><b>Sähköposti:</b> jalal.al.badri26@gmail.com<br><b>Päiväys:</b> lokakuu 2026</p>`};
function openAbout(lang=uiLanguage){const dir=['ar','fa'].includes(lang)?'rtl':'';const names={en:'About JSCD',ar:'حول المشروع',fa:'درباره پروژه',fi:'Tietoja projektista'};$('modalHost').innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-label="About JSCD"><div class="modalBody"><div class="modalTop"><h2>'+names[lang]+'</h2><button id="closeModal" class="btn" aria-label="Close">×</button></div><div class="langbar">'+[['en','English'],['ar','عربي'],['fa','فارسی'],['fi','Suomi']].map(x=>'<button class="btn '+(lang===x[0]?'gold':'')+'" data-about-lang="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div class="aboutText '+dir+'">'+aboutContents[lang]+'</div></div></div>';$('closeModal').onclick=()=>{$('modalHost').innerHTML=''};document.querySelectorAll('[data-about-lang]').forEach(x=>x.onclick=()=>openAbout(x.dataset.aboutLang));$('modalHost').querySelector('.modal').onclick=e=>{if(e.target.classList.contains('modal'))$('modalHost').innerHTML=''}}
