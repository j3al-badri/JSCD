.realPhotoSection{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:12px}.photoGallery{margin:10px 0}.photoGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photoTile{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;padding:7px;min-width:0}.photoZoom{display:block;width:100%;padding:0;border:0;background:transparent}.photoZoom img{display:block;width:100%;height:120px;object-fit:contain;background:#e8edf0;border-radius:7px}.photoTile .caption{overflow-wrap:anywhere;font-size:12px}.photoTile a,.photoTools a{font-size:12px;color:var(--cyan);overflow-wrap:anywhere}.photoTools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.photoTools a{padding:7px;border:1px solid var(--line);border-radius:8px}.photoOverlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:12px}.photoOverlayInner{width:min(100%,850px);max-height:95dvh;overflow:auto;text-align:center}.photoOverlay img{display:block;max-width:100%;max-height:70dvh;object-fit:contain;margin:12px auto}.photoClose{display:block;margin-left:auto}@media(min-width:680px){.photoGrid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Photo-based numbered component board: actual photos, no fabricated positions */
.componentPhotoBoard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:13px 0;padding:10px;border-radius:14px;border:1px solid #526779;background:#102a40}
.componentPhotoCell{position:relative;min-width:0;background:#163147;border:1px solid #43627b;border-radius:12px;overflow:hidden;text-align:left;color:#edf5fd;cursor:pointer;padding:0 0 9px}
.componentPhotoCell.selected{outline:2px solid #e0b85e}
.componentPhotoCell:hover{border-color:#32bdd0}
.componentPhotoCell:focus-visible{outline:3px solid #f5ca68;outline-offset:2px}
.componentPhotoCell img{width:100%;height:125px;object-fit:contain;display:block;background:#edf0f2}
.componentPhotoCell .photoNumber{position:absolute;top:6px;left:6px;display:grid;place-items:center;background:#087ea0;color:white;border:2px solid white;width:30px;height:30px;border-radius:50%;font-weight:900;z-index:1}
.componentPhotoCell .photoLabel{display:block;padding:8px 9px 0;font-size:12px;font-weight:700;line-height:1.3;min-height:39px}
.componentPhotoCell .photoSource{display:block;padding:0 9px;font-size:10px;color:#bbd1e0}
.componentPhotoCell .photoPending{display:grid;place-items:center;height:125px;text-align:center;padding:12px;color:#aabecb;font-size:12px}
.componentPhotoCell .zoomPart{position:absolute;right:6px;top:6px;border:1px solid white;border-radius:8px;background:#102b40;color:white;font-size:11px;padding:5px 7px;z-index:2}
@media(min-width:650px){.componentPhotoBoard{grid-template-columns:repeat(3,minmax(0,1fr))}.componentPhotoCell img,.componentPhotoCell .photoPending{height:145px}}

.interfaceLanguages{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px}.interfaceLanguages button{color:#f1f7fa;background:#19364d;border:1px solid #52748a;border-radius:9px;padding:7px 10px;min-height:39px;flex:1}.interfaceLanguages button.active{border-color:#f3c36e;background:#65502a}.localizedRTL{direction:rtl;text-align:right}.localizedRTL .choice{text-align:right}.localizedRTL .number{margin-left:7px;margin-right:0}.localizedRTL .results th,.localizedRTL .results td{text-align:right}.localizedRTL .check{direction:rtl}.localizedRTL input,.localizedRTL textarea{direction:auto;text-align:start}.localizedRTL .photoLabel{text-align:right}.interfaceLanguages{direction:ltr}.faultsHeading{color:#8B171B !important;background:#FFE8E8;padding:8px 12px;border-radius:8px;font-weight:800;}

/* JSCD v2.3: results classification, independent of diagnostic scoring */
.faultBadge{display:inline-block;border-radius:7px;padding:3px 9px;font-size:12px;font-weight:800;border:1px solid;margin:6px 0}
.fault-primary{background:#153e2e;color:#acffcb;border-color:#339965}
.fault-possible{background:#172f58;color:#b5d5ff;border-color:#4a83d3}
.fault-suspected{background:#473016;color:#ffe0a3;border-color:#b17c2f}
.faultSafety{background:#531e28;border:1px solid #cc5b64;border-radius:9px;color:#fff1f0;padding:9px;margin-top:8px;font-size:13px}

/* Compact language controls only; no layout or engine modifications */
.interfaceLanguages{display:flex;justify-content:flex-start;align-items:center;gap:3px;flex-wrap:nowrap;margin:2px 0 7px;padding:0}
.interfaceLanguages button{flex:0 0 auto;min-height:28px;padding:4px 9px;font-size:11.5px;font-weight:700;border-radius:7px;line-height:1.2;box-shadow:inset 0 1px 0 #ffffff17}
.interfaceLanguages button.active{border-color:#f3c36e;background:#66502a;box-shadow:0 0 0 1px #dcb36644}
/* Twice the separation between the main toolbar and compact language buttons. */
.interfaceLanguages{margin-top:14px}
@media(max-width:360px){.interfaceLanguages button{padding:4px 6px;font-size:10.5px}}
.guideText h3{margin-top:19px;margin-bottom:6px}.guideText ol{padding-inline-start:24px}.guideText li{margin:7px 0}.guideText p{line-height:1.62}
.aboutText h3{color:#7cdbdf;margin:17px 0 5px}.aboutText p{margin:7px 0;line-height:1.6}

/* JSCD v2.3.9: high-contrast step indicator in light/dark phone themes. */
.stepper .step{background:#F1F3F5!important;color:#243140!important;border:1px solid #D5DCE0!important;font-weight:600;-webkit-text-fill-color:#243140}
.stepper .step.done{background:#E5F5F2!important;color:#166534!important;border:1px solid #A7D9C7!important;-webkit-text-fill-color:#166534}
.stepper .step.current{background:#087F8C!important;color:#FFFFFF!important;border:2px solid #074F59!important;font-weight:800;-webkit-text-fill-color:#FFFFFF}
.stepper .step.current::before{content:'● ';color:#FFFFFF}
.stepper .step.done::before{content:'✓ ';color:#166534;font-weight:900}

mation.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـتلف حامل العادم.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به خرابی آویز اگزوز انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Vaurioitunut pakoputken kannatin."],"Do not run the engine in enclosed areas. A qualified technician should inspect for leaks.":["لا تشغّل المحرك في مكان مغلق؛ يراجع فني مؤهل مواضع التسرب.","موتور را در فضای بسته روشن نکنید؛ متخصص نشتی را بررسی کند.","Älä käytä moottoria suljetussa tilassa; ammattilainen tarkistaa vuodot."],"Repair leaking exhaust pipe, joint, or gasket.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـتسرب العادم.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به نشتی اگزوز انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Pakokaasuvuoto."],"Have muffler inspected for corrosion, holes and loose internal parts.":["افحص كاتم الصوت للصدأ والثقوب والأجزاء الداخلية المرتخية.","صداخفه‌کن را از نظر زنگ‌زدگی، سوراخ و قطعات شل بررسی کنید.","Tarkista äänenvaimentimen ruoste, reiät ja irto-osat."],"Repair or replace muffler if necessary.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـتلف كاتم الصوت.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به خرابی صداخفه‌کن انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Vaurioitunut äänenvaimennin."],"Ask a technician to inspect link joints while the vehicle is safely supported.":["ليتحقق فني من مفاصل وصلات التوازن مع رفع السيارة بأمان.","تکنسین اتصالات میل تعادل را با بلند کردن ایمن خودرو بررسی کند.","Korjaaja tarkistaa vakaajan nivelet turvallisesti nostetusta autosta."],"Replace worn link(s) after confirmation.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـتآكل وصلة التوازن.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به فرسودگی میل رابط تعادل انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Kulunut vakaajatanko."],"Check for torn rubber, movement, or play with appropriate lifting equipment.":["افحص تمزق الجلب أو الخلوص باستخدام معدات رفع مناسبة.","پارگی بوش و لقی را با تجهیزات بالابر مناسب بررسی کنید.","Tarkista puslien repeämät ja välykset asianmukaisilla nostolaitteilla."],"Replace confirmed worn bushings / arms.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـتآكل جلبة التعليق.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به فرسودگی بوش تعلیق انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Kulunut jousituksen pusla."],"Look for visible leakage and excessive body bounce; road safety checks require a professional.":["افحص التسرب الظاهر والارتداد الزائد؛ فحص السلامة يحتاج مختصاً.","نشتی ظاهری و نوسان بیش از حد را بررسی کنید؛ ایمنی باید تخصصی بررسی شود.","Tarkista näkyvät vuodot ja liiallinen heilahtelu; turvallisuustarkastus vaatii ammattilaisen."],"Replace worn dampers as recommended for the axle.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـتلف ممتص الصدمات.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به خرابی کمک‌فنر انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Kulunut iskunvaimennin."],"Visually inspect safely for ride-height imbalance or broken coils; do not compress springs yourself.":["افحص اختلاف ارتفاع السيارة أو انكسار النابض بصرياً؛ لا تضغط النوابض بنفسك.","اختلاف ارتفاع یا شکستگی فنر را بصری بررسی کنید؛ فنر را خودتان فشرده نکنید.","Tarkista korkeuspoikkeamat ja jousivauriot silmämääräisesti; älä purista jousta itse."],"Qualified mechanic replaces damaged spring with proper tools.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـكسر أو هبوط النابض الحلزوني.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به شکستگی یا افتادگی فنر لول انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Katkennut tai painunut kierrejousi."],"Have technician inspect bearing play and noise under safe workshop conditions.":["يفحص الفني خلوص المحمل وصوته في الورشة.","تکنسین لقی و صدای بلبرینگ را در تعمیرگاه بررسی کند.","Ammattilainen tarkistaa laakerin välyksen ja äänen korjaamolla."],"Replace bearing/hub assembly if confirmed.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـتآكل محمل العجلة.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به فرسودگی بلبرینگ چرخ انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Kulunut pyöränlaakeri."],"Measure cold tire pressures and visually inspect tread and sidewalls.":["قس ضغط الإطارات وهي باردة وافحص المداس والجوانب.","فشار لاستیک سرد و آج و دیواره را بررسی کنید.","Mittaa kylmät rengaspaineet ja tarkista kulutuspinta sekä sivut."],"Set correct pressures or replace damaged tires.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـعيب بالإطار أو ضغط غير صحيح.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به خرابی لاستیک یا فشار نامناسب انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Rengasvika tai väärä rengaspaine."],"Brake safety concern: professional inspection of pad thickness and disc condition.":["يجب فحص سماكة البطانات وحالة الأقراص لدى مختص.","ضخامت لنت و وضعیت دیسک باید تخصصی بررسی شود.","Ammattilaisen on tarkistettava palojen paksuus ja levyjen kunto."],"Replace worn pads and inspect discs if needed.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـتآكل بطانات الفرامل.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به سایش لنت ترمز انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Jarrupalojen kuluminen."],"Stop using vehicle if brakes overheat, drag or braking is unsafe.":["أوقف الاستخدام عند سخونة الفرامل أو انحشارها؛ يلزم فحص متخصص.","اگر ترمز داغ یا گیر می‌کند، رانندگی را متوقف و به متخصص مراجعه کنید.","Lopeta ajo, jos jarrut kuumenevat tai laahaavat; teetä tarkastus."],"Professional service of caliper, hoses, pads and discs.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـانحشار ملقط الفرامل.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به گیر کردن کالیپر ترمز انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Jumittunut jarrusatula."],"Do not drive if steering is loose. Professional steering inspection required.":["لا تقد السيارة عند ارتخاء التوجيه؛ يلزم فحص مهني.","با فرمان لق رانندگی نکنید؛ بررسی تخصصی لازم است.","Älä aja, jos ohjaus on väljä; ammattilaisen tarkastus tarvitaan."],"Replace defective linkage and perform alignment.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـارتخاء وصلات التوجيه.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به شل شدن اتصالات فرمان انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Löysä ohjausnivelistö."],"Measure 12V voltage using suitable meter; check terminals and service information.":["قس جهد بطارية 12 فولت بأداة مناسبة وافحص الأقطاب ودليل الخدمة.","ولتاژ باتری ۱۲ ولت، پایانه‌ها و راهنمای سرویس را بررسی کنید.","Mittaa 12 V akku sopivalla mittarilla; tarkista navat ja huolto-ohjeet."],"Charge, test and replace battery if needed.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـضعف بطارية 12 فولت.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به ضعف باتری ۱۲ ولت انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Heikko 12 V akku."],"Have charging system voltage tested with appropriate equipment.":["اختبر نظام الشحن والجهد بمعدات مناسبة لدى الفني.","ولتاژ سامانه شارژ باید با تجهیزات مناسب آزمایش شود.","Latausjärjestelmän jännite tulee tarkistaa asianmukaisilla laitteilla."],"Repair charging system after confirming fault.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـخلل المولد أو الشحن.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به خرابی دینام یا شارژ انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Laturin tai latauksen vika."],"A technician must inspect pulleys/belts with engine OFF; keep hands away from moving parts.":["افحص السير والبكرات والمحرك متوقف، ولا تقترب من الأجزاء المتحركة.","تسمه و پولی را با موتور خاموش بررسی کنید؛ از قطعات متحرک دور بمانید.","Tarkista hihna ja pyörät moottori sammutettuna, pysy erossa liikkuvista osista."],"Replace damaged belt, pulley or tensioner only after diagnosis.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـارتخاء سير الملحقات أو الشداد.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به شل شدن تسمه جانبی یا سفت‌کن انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Löysä apulaitehihna tai kiristin."],"Qualified technician should inspect mount condition with engine stopped.":["يفحص الفني قواعد المحرك بعد إيقافه.","تکنسین پایه‌های موتور را با موتور خاموش بررسی کند.","Ammattilainen tarkistaa moottorintuet moottori sammutettuna."],"Replace damaged mount after confirmation.":["لا تُجرِ إصلاحاً أو استبدالاً إلا بعد تأكيد سبب العطل وفحص الجزء المتعلق بـتلف قاعدة المحرك.","تعمیر یا تعویض فقط پس از تأیید علت عیب و بررسی بخش مربوط به خرابی دسته موتور انجام شود.","Korjaa tai vaihda vasta vian syyn vahvistamisen ja seuraavan kohteen tarkistuksen jälkeen: Moottorin kiinnikkeen vaurio."],"Stop driving if engine overheats; keep away from fans that may start automatically.":["أوقف القيادة عند ارتفاع حرارة المحرك وابتعد عن المروحة. Object.assign(UI_TRANSLATIONS,{"Ignition coil malfunction":["خلل في ملف الإشعال","خرابی کویل احتراق","Sytytyspuolan toimintahäiriö"],"Read engine DTCs and inspect ignition system with engine off; avoid high voltage ignition output.":["اقرأ رموز أعطال المحرك وافحص الإشعال والمحرك متوقف؛ تجنب الجهد العالي لملف الإشعال.","کدهای خطای موتور را بخوانید و سیستم جرقه‌زنی را با موتور خاموش بررسی کنید؛ از خروجی ولتاژ بالای کویل دوری کنید.","Lue moottorin vikakoodit ja tarkista sytytysjärjestelmä moottorin ollessa sammutettuna; vältä sytytyksen korkeajännitettä."],"Replace the verified failed coil or repair its wiring.":["استبدل ملف الإشعال الذي ثبت تلفه أو أصلح توصيلاته.","کویل معیوب تأییدشده را تعویض یا سیم‌کشی آن را تعمیر کنید.","Vaihda varmistetusti viallinen puola tai korjaa sen johdotus."],"Spark plug deterioration":["تآكل شمعات الإشعال","فرسودگی شمع‌های موتور","Sytytystulppien kuluminen"],"Check service history and relevant misfire codes; technician inspects plugs after engine cools.":["راجع سجل الصيانة ورموز اختلال الاشتعال؛ يفحص الفني الشمعات بعد برودة المحرك.","سوابق سرویس و کدهای احتراق ناقص را بررسی کنید؛ تکنسین پس از سرد شدن موتور شمع‌ها را بازبینی کند.","Tarkista huoltohistoria ja sytytyskatkoskoodit; asentaja tarkistaa tulpat moottorin jäähdyttyä."],"Fit vehicle-specified plugs after confirmed wear or failure.":["ركّب الشمعات المحددة للسيارة بعد تأكيد تآكلها أو تلفها.","در صورت تأیید فرسودگی، شمع‌های مناسب خودرو را نصب کنید.","Asenna autoon määritetyt tulpat, kun kuluminen on varmistettu."],"Crankshaft position sensor fault":["خلل حساس موضع عمود المرفق","خرابی حسگر موقعیت میل‌لنگ","Kampiakselin asentotunnistimen vika"],"Record DTCs and live RPM while cranking with an appropriate scan tool.":["سجل رموز الأعطال وقراءة سرعة دوران المحرك أثناء محاولة التشغيل بجهاز فحص مناسب.","کدهای خطا و دور موتور هنگام استارت را با دستگاه مناسب ثبت کنید.","Tallenna vikakoodit ja moottorin kierroslukutieto käynnistyksen aikana sopivalla testerillä."],"Diagnose sensor circuit and replace only the failed component.":["افحص دائرة الحساس ولا تستبدل إلا المكوّن المتعطل.","مدار حسگر را بررسی و فقط قطعه خراب را تعویض کنید.","Tutki anturin virtapiiri ja vaihda vain vialliseksi todettu osa."],"Fuel injector imbalance":["اختلال أداء بخاخات الوقود","نامتعادل بودن عملکرد انژکتورها","Polttoainesuuttimien toimintaero"],"Read fuel trim and misfire data; high-pressure fuel systems require professional testing.":["افحص بيانات تصحيح خليط الوقود واختلال الاشتعال؛ اختبار الوقود عالي الضغط من عمل المختص.","داده‌های اصلاح سوخت و احتراق ناقص را بخوانید؛ آزمایش سوخت پرفشار به متخصص نیاز دارد.","Tarkista polttoainekorjaukset ja sytytyskatkostiedot; korkeapainejärjestelmän testaus kuuluu ammattilaiselle."],"Repair injector fault if supported by diagnostics.":["أصلح خلل البخاخات بعد إثباته بالفحص.","خرابی انژکتور را فقط پس از تأیید عیب‌یابی تعمیر کنید.","Korjaa suutin vain, jos vika on varmistettu diagnostiikalla."],"Engine oil pressure warning":["تحذير انخفاض ضغط زيت المحرك","هشدار فشار روغن موتور","Moottoriöljyn painevaroitus"],"If oil-pressure warning is illuminated, stop the engine; have actual pressure checked professionally.":["إذا ظهر تحذير ضغط الزيت فأوقف المحرك، واطلب قياس الضغط الحقيقي لدى مختص.","اگر هشدار فشار روغن روشن است موتور را خاموش کنید و فشار واقعی را متخصص اندازه بگیرد.","Jos öljynpainevaroitus palaa, sammuta moottori ja mittauta todellinen paine ammattilaisella."],"Correct confirmed lubrication defect before running engine.":["عالج عطل التزييت المؤكد قبل تشغيل المحرك مجدداً.","قبل از روشن کردن موتور، عیب تأییدشده روانکاری را برطرف کنید.","Korjaa varmistettu voiteluvika ennen moottorin käynnistämistä."],"Radiator or cooling system blockage":["انسداد المشع (الراديتر) أو نظام التبريد","گرفتگی رادیاتور یا سیستم خنک‌کاری","Jäähdyttimen tai jäähdytysjärjestelmän tukos"],"Check coolant level only after cooling; qualified technician checks heat distribution and flow.":["افحص مستوى سائل التبريد بعد أن يبرد النظام فقط؛ يفحص الفني توزيع الحرارة وتدفق السائل.","سطح مایع خنک‌کننده را فقط پس از سرد شدن بررسی کنید؛ تکنسین توزیع گرما و جریان را بسنجد.","Tarkista jäähdytysnesteen määrä vasta järjestelmän jäähdyttyä; ammattilainen tarkistaa virtauksen ja lämmön jakautumisen."],"Repair obstruction or radiator only after confirming restricted flow.":["أزل الانسداد أو أصلح المشع فقط بعد التأكد من ضعف التدفق.","تنها پس از تأیید محدودیت جریان، گرفتگی یا رادیاتور را تعمیر کنید.","Korjaa tukos tai jäähdytin vasta, kun virtausrajoitus on varmistettu."],"Cooling pump malfunction":["خلل مضخة سائل التبريد","خرابی پمپ مایع خنک‌کننده","Jäähdytysnestepumpun toimintahäiriö"],"Have a technician inspect pump operation and leaks with engine off and cooled.":["اطلب من الفني فحص عمل المضخة والتسربات والمحرك متوقف وبارد.","تکنسین عملکرد پمپ و نشتی را با موتور خاموش و سرد بررسی کند.","Anna asentajan tarkistaa pumpun toiminta ja vuodot, kun moottori on sammutettu ja jäähtynyt."],"Replace a confirmed faulty cooling pump.":["استبدل مضخة التبريد بعد التأكد من عطلها.","پمپ معیوب را پس از تأیید خرابی تعویض کنید.","Vaihda pumppu vain varmistetun vian perusteella."],"Vacuum / intake hose leak":["تسرب هواء من خرطوم السحب أو التفريغ","نشتی خلأ یا شیلنگ ورودی هوا","Imu- tai alipaineletkun vuoto"],"Technician checks intake hoses and fuel-trim data, avoiding moving or hot parts.":["يفحص الفني خراطيم السحب وبيانات تصحيح الوقود مع تجنب الأجزاء الساخنة والمتحركة.","تکنسین شیلنگ‌های ورودی و داده‌های اصلاح سوخت را بدون تماس با قطعات داغ یا متحرک بررسی کند.","Asentaja tarkistaa imuletkut ja polttoainekorjausarvot välttäen kuumia ja liikkuvia osia."],"Repair confirmed intake leak and verify engine operation.":["أصلح تسرب السحب المؤكد وتحقق من تشغيل المحرك.","نشتی تأییدشده ورودی را تعمیر و عملکرد موتور را کنترل کنید.","Korjaa varmistettu imuvuoto ja tarkista moottorin käynti."],"Turbocharger boost control issue":["خلل التحكم بضغط الشاحن التوربيني","خرابی کنترل فشار توربوشارژر","Turboahtimen ahtopaineen säätövika"],"Check recorded boost pressure and codes with a suitable scanner; do not touch hot turbo.":["افحص رموز الأعطال وضغط الشحن المسجل بجهاز مناسب؛ لا تلمس الشاحن الساخن.","فشار بوست و کدهای ثبت‌شده را با اسکنر مناسب بررسی کنید؛ به توربوی داغ دست نزنید.","Tarkista tallennettu ahtopaine ja vikakoodit soveltuvalla lukijalla; älä koske kuumaan turboon."],"Repair verified boost-control, hose or turbo fault.":["أصلح خلل التحكم أو الخرطوم أو الشاحن بعد التأكد.","عیب تأییدشده کنترل بوست، شیلنگ یا توربو را تعمیر کنید.","Korjaa varmistettu säätö-, letku- tai turboahtimen vika."],"Clutch slippage":["انزلاق قابض ناقل الحركة","لغزش کلاچ","Kytkimen luistaminen"],"Qualified technician checks clutch operation and vehicle-specific test criteria.":["يفحص فني مؤهل عمل القابض وفق معايير السيارة المحددة.","تکنسین واجد صلاحیت عملکرد کلاچ و معیارهای مخصوص خودرو را بررسی کند.","Pätevä asentaja tarkistaa kytkimen toiminnan ja automallin testausvaatimukset."],"Repair verified clutch failure.":["أصلح عطل القابض بعد التحقق منه.","خرابی تأییدشده کلاچ را تعمیر کنید.","Korjaa varmistettu kytkinvika."],"CV joint or driveshaft wear":["تآكل مفصل السرعة الثابتة أو عمود نقل الحركة","فرسودگی مفصل CV یا پلوس","Vetonivelen tai vetoakselin kuluminen"],"With vehicle stationary, inspect visible boots and leaks; technician performs safe driveline inspection.":["مع توقف السيارة افحص الأغطية المطاطية والتسربات الظاهرة؛ يتولى الفني فحص منظومة النقل بأمان.","در حالت توقف خودرو، گردگیرها و نشتی‌های آشکار را ببینید؛ بررسی ایمن انتقال نیرو با تکنسین است.","Tarkista pysäköidyn auton näkyvät suojakumit ja vuodot; asentaja tarkastaa voimansiirron turvallisesti."],"Replace confirmed worn CV joint or shaft.":["استبدل المفصل أو العمود بعد التأكد من التآكل.","مفصل یا محور فرسوده تأییدشده را تعویض کنید.","Vaihda todetusti kulunut vetonivel tai vetoakseli."],"Wheel alignment / steering geometry issue":["خلل محاذاة العجلات أو هندسة التوجيه","خرابی تنظیم زوایای چرخ یا هندسه فرمان","Pyöränsuuntauksen tai ohjausgeometrian vika"],"Inspect tyre pressures first and have alignment and steering play measured professionally.":["افحص ضغط الإطارات أولاً، ثم اطلب قياس زوايا العجلات وخلوص التوجيه لدى مختص.","ابتدا فشار لاستیک‌ها را بررسی کنید و سپس زوایا و لقی فرمان را متخصص اندازه بگیرد.","Tarkista ensin rengaspaineet ja mittauta pyöränkulmat sekä ohjauksen välykset ammattilaisella."],"Correct root cause and perform wheel alignment.":["أصلح السبب الأصلي ثم اضبط زوايا العجلات.","علت اصلی را رفع و زوایای چرخ را تنظیم کنید.","Korjaa perussyy ja tee pyöränsuuntaus."],"ABS hydraulic unit or sensor wiring fault":["خلل وحدة ABS الهيدروليكية أو أسلاك الحساسات","خرابی واحد هیدرولیک ABS یا سیم‌کشی حسگر","ABS-hydrauliikkayksikön tai anturijohdotuksen vika"],"Read ABS-specific DTCs and live wheel-speed data using compatible diagnostics.":["اقرأ رموز أعطال ABS وبيانات سرعة العجلات المباشرة باستخدام جهاز متوافق.","کدهای ویژه ABS و داده زنده سرعت چرخ‌ها را با دستگاه سازگار بخوانید.","Lue ABS-vikakoodit ja pyöränopeuksien reaaliaikaiset tiedot yhteensopivalla testerillä."],"Repair diagnosed wiring, sensor or hydraulic unit fault only after confirmation.":["أصلح الأسلاك أو الحساس أو الوحدة الهيدروليكية وفق العطل المثبت فقط.","سیم‌کشی، حسگر یا واحد هیدرولیک را فقط پس از تأیید تعمیر کنید.","Korjaa johdotus, anturi tai hydrauliikkayksikkö vasta vian varmistamisen jälkeen."],"Brake fluid leakage":["تسرب سائل الفرامل","نشتی روغن ترمز","Jarrunestevuoto"],"Do not drive with suspected loss of brake fluid or reduced braking; professional towing and inspection.":["لا تقد السيارة عند الاشتباه بتسرب سائل الفرامل أو ضعف الكبح؛ استعن بالسحب والفحص المهني.","با احتمال نشتی روغن ترمز یا کاهش قدرت ترمز رانندگی نکنید؛ خودرو را برای بررسی تخصصی یدک بکشید.","Älä aja, jos jarrunestevuotoa tai jarrutehon heikkenemistä epäillään; järjestä hinaus ja ammattitarkastus."],"Qualified technician repairs hydraulic leak and tests braking system.":["يصلح فني مؤهل التسرب الهيدروليكي ثم يختبر منظومة الفرامل.","تکنسین مجاز نشتی را تعمیر و سامانه ترمز را آزمایش کند.","Ammattilainen korjaa hydraulivuodon ja testaa jarrujärjestelmän."],"12V grounding / terminal connection fault":["خلل تأريض أو أطراف بطارية 12 فولت","خرابی اتصال زمین یا پایانه باتری ۱۲ ولت","12 V:n maadoitus- tai liitinvika"],"Inspect accessible 12V terminals visually with car off; technician performs voltage-drop testing.":["افحص أطراف البطارية الظاهرة بصرياً والسيارة متوقفة؛ يجري الفني اختبار هبوط الجهد.","با خودروی خاموش پایانه‌های در دسترس را چشمی ببینید؛ تکنسین افت ولتاژ را اندازه بگیرد.","Tarkista näkyvät 12 V:n liittimet auton ollessa sammutettuna; asentaja tekee jännitehäviömittauksen."],"Clean or repair confirmed faulty 12V connections.":["نظّف أو أصلح وصلات 12 فولت التي ثبت خللها.","اتصالات معیوب تأییدشده ۱۲ ولت را تمیز یا تعمیر کنید.","Puhdista tai korjaa varmistetusti vialliset 12 V:n liitokset."],"Electric drive inverter fault":["خلل عاكس الدفع الكهربائي","خرابی اینورتر محرک برقی","Sähköisen voimansiirron invertterivika"],"Record exact dashboard warnings and read manufacturer-specific codes with an EV-qualified technician.":["دوّن التحذيرات كما تظهر على الشاشة، واقرأ رموز الشركة لدى فني مؤهل للسيارات الكهربائية.","هشدارهای صفحه را دقیق ثبت کنید و کدهای سازنده را نزد تکنسین خودروی برقی بخوانید.","Kirjaa tarkat mittariston varoitukset ja luetuta valmistajakohtaiset vikakoodit sähköautoihin pätevöityneellä asentajalla."],"Qualified EV service diagnoses inverter or its cooling and wiring.":["يفحص مختص العاكس وتبريده وتوصيلاته ويصلح العطل المثبت.","سرویس تخصصی اینورتر، خنک‌کاری و سیم‌کشی آن را بررسی و تعمیر کند.","Pätevä huolto tarkistaa invertterin, jäähdytyksen ja johdotuksen ja korjaa todetun vian."],"High voltage contactor or precharge issue":["خلل موصل الجهد العالي أو دائرة الشحن التمهيدي","خرابی کنتاکتور ولتاژ بالا یا مدار پیش‌شارژ","Korkeajännitekontaktorin tai esilatauksen vika"],"Do not access high-voltage circuits. Record warning and request qualified HV diagnostic.":["لا تلمس دوائر الجهد العالي؛ سجل التحذير واطلب فحصاً من مختص.","به مدارهای ولتاژ بالا دست نزنید؛ هشدار را ثبت و بررسی تخصصی درخواست کنید.","Älä käsittele korkeajännitepiirejä. Kirjaa varoitus ja pyydä pätevää diagnostiikkaa."],"EV-qualified workshop confirms and repairs HV precharge or contactor circuit.":["تتحقق ورشة مؤهلة من دائرة الشحن التمهيدي أو موصل الجهد العالي وتصلحها.","کارگاه تخصصی مدار پیش‌شارژ یا کنتاکتور را تأیید و تعمیر کند.","Sähköautoihin pätevöitynyt korjaamo varmistaa ja korjaa esilataus- tai kontaktoripiirin."],"EV battery coolant circulation fault":["خلل دوران سائل تبريد بطارية السيارة الكهربائية","خرابی گردش مایع خنک‌کننده باتری برقی","Sähköauton akun jäähdytysnesteen kiertohäiriö"],"Check displayed thermal warnings; EV-qualified workshop verifies pump and temperature data.":["تحقق من تحذيرات الحرارة المعروضة؛ تفحص ورشة متخصصة المضخة وبيانات الحرارة.","هشدارهای حرارتی نمایشگر را بررسی کنید؛ کارگاه تخصصی پمپ و داده دما را ارزیابی کند.","Tarkista näytön lämpötilavaroitukset; pätevä korjaamo tarkistaa pumpun ja lämpötilatiedot."],"Repair verified battery thermal management fault.":["أصلح العطل المؤكد في الإدارة الحرارية للبطارية.","عیب تأییدشده مدیریت حرارتی باتری را برطرف کنید.","Korjaa todettu akun lämmönhallinnan vika."],"Charging cable or station compatibility problem":["عدم توافق كابل الشحن أو محطة الشحن","ناسازگاری کابل یا ایستگاه شارژ","Latauskaapelin tai latausaseman yhteensopivuusongelma"],"Try an approved, undamaged charging cable or station only when safe, without touching contacts.":["جرّب كابلاً أو محطة معتمدين وسليمين إذا كان ذلك آمناً، دون لمس نقاط التوصيل.","فقط در صورت ایمنی کابل یا ایستگاه سالم و تأییدشده را امتحان کنید؛ به کنتاکت‌ها دست نزنید.","Kokeile hyväksyttyä, ehjää kaapelia tai asemaa vain turvallisesti; älä koske sähköliittimiin."],"Replace faulty approved cable or resolve station compatibility after checks.":["استبدل الكابل المعطّل أو عالج عدم التوافق بعد التحقق.","پس از بررسی، کابل خراب را تعویض یا ناسازگاری ایستگاه را رفع کنید.","Vaihda viallinen kaapeli tai ratkaise yhteensopivuusongelma tarkistusten jälkeen."],"Hybrid electric motor control malfunction":["خلل التحكم بالمحرك الكهربائي الهجين","خرابی کنترل موتور برقی هیبرید","Hybridin sähkömoottorin ohjausvika"],"Record fault messages and request manufacturer-specific hybrid diagnostic; avoid HV access.":["سجل رسائل الأعطال واطلب فحصاً خاصاً بالطراز؛ تجنب أجزاء الجهد العالي.","پیام‌های خطا را ثبت و عیب‌یابی مخصوص سازنده درخواست کنید؛ از مدارهای ولتاژ بالا دوری کنید.","Kirjaa vikailmoitukset ja pyydä valmistajakohtaista hybrididiagnostiikkaa; vältä korkeajänniteosia."],"Qualified hybrid technician addresses verified motor-control fault.":["يعالج فني هجين مؤهل عطل التحكم بالمحرك بعد إثباته.","تکنسین هیبرید واجد صلاحیت خرابی کنترل موتور را برطرف کند.","Hybrideihin pätevöitynyt asentaja korjaa varmistetun moottorinohjausvian."],"Cabin blower motor failure":["تعطل مروحة هواء المقصورة","خرابی موتور دمنده کابین","Matkustamon puhallinmoottorin vika"],"Check fan-speed response and cabin filter without accessing moving components.":["تحقق من استجابة سرعات المروحة وفلتر المقصورة دون الوصول للأجزاء المتحركة.","پاسخ سرعت‌های فن و فیلتر کابین را بدون دسترسی به قطعات متحرک بررسی کنید.","Tarkista puhallinnopeuksien toiminta ja raitisilmasuodatin koskematta liikkuviin osiin."],"Repair faulty blower motor or control after diagnosis.":["أصلح محرك المروحة أو وحدتها بعد التشخيص.","پس از تشخیص، موتور دمنده یا کنترل آن را تعمیر کنید.","Korjaa viallinen puhallinmoottori tai ohjaus diagnostiikan jälkeen."],"TPMS sensor or tyre pressure issue":["خلل حساس ضغط الإطارات TPMS أو ضغط الإطار","خرابی حسگر TPMS یا فشار باد لاستیک","TPMS-anturin tai rengaspaineen ongelma"],"Measure cold pressures to manufacturer specification and check TPMS indicator.":["قس ضغط الإطارات وهي باردة وفق مواصفات الشركة، وافحص مؤشر TPMS.","فشار لاستیک سرد را مطابق مشخصات سازنده اندازه بگیرید و چراغ TPMS را بررسی کنید.","Mittaa kylmien renkaiden paineet valmistajan ohjeen mukaan ja tarkista TPMS-merkkivalo."],"Inflate appropriately or inspect TPMS after verifying pressure.":["اضبط الضغط أو افحص نظام TPMS بعد التحقق من الضغط.","پس از تأیید فشار، باد را تنظیم یا سامانه TPMS را بررسی کنید.","Säädä paine tai tarkista TPMS vasta painemittauksen jälkeen."],"reduced cooling":["ضعف تدفق التبريد","کاهش جریان خنک‌کاری","Heikentynyt jäähdytyskierto"],"coolant circulation":["دوران سائل التبريد","گردش مایع خنک‌کننده","Jäähdytysnesteen kierto"],"low oil pressure":["انخفاض ضغط الزيت","فشار کم روغن","Alhainen öljynpaine"],"battery cooling":["تبريد البطارية","خنک‌کاری باتری","Akun jäähdytys"],"inverter":["العاكس الكهربائي","اینورتر","Invertteri"],"bad connection":["اتصال غير سليم","اتصال نامناسب","Huono liitos"],"brake hydraulic":["دائرة الفرامل الهيدروليكية","سامانه هیدرولیک ترمز","Jarruhydrauliikka"],"charge connection":["توصيل الشحن","اتصال شارژ","Latausliitäntä"]});

Object.assign(UI_TRANSLATIONS, {"Real Component Photographs":["صور حقيقية لأجزاء السيارة","عکس‌های واقعی قطعات خودرو","Auton osien aidot valokuvat"],"Reference photographs from external sources. They may not depict your exact car or show the precise component location. Open the credited source to inspect licensing and accuracy.":["صور مرجعية من مصادر خارجية. قد لا تمثل سيارتك تماماً أو تُظهر الموقع الدقيق للقطعة. افتح رابط المصدر للتحقق من دقة الصورة وترخيص استخدامها.","این عکس‌های مرجع از منابع بیرونی تهیه شده‌اند. ممکن است با خودروی شما دقیقاً مطابقت نداشته باشند یا محل دقیق قطعه را نشان ندهند. برای بررسی دقت و مجوز استفاده، منبع ذکرشده را باز کنید.","Viitekuvat ovat ulkoisista lähteistä. Ne eivät välttämättä vastaa täsmälleen autoasi tai näytä osan tarkkaa sijaintia. Tarkista kuvan oikeellisuus ja käyttöoikeus ilmoitetusta lähteestä."],"Select a component, then tap Load Real Photos. Internet required.":["اختر قطعة، ثم اضغط «تحميل الصور الحقيقية». يلزم الاتصال بالإنترنت.","یک قطعه انتخاب کنید، سپس روی «بارگذاری عکس‌های واقعی» بزنید. اتصال اینترنت لازم است.","Valitse osa ja napauta sitten ”Lataa aidot valokuvat”. Internet-yhteys tarvitaan."],"Load Real Photos (iFixit / Wikimedia)":["تحميل الصور الحقيقية (iFixit / Wikimedia)","بارگذاری عکس‌های واقعی (iFixit / Wikimedia)","Lataa aidot valokuvat (iFixit / Wikimedia)"],"Real component reference photographs, numbered to match the selection list. Tap any photograph (available or unavailable) to open Google Images. Select the component only by tapping its name in the numbered list below.":["صور مرجعية حقيقية للقطع، مرقمة وفق قائمة الاختيار. اضغط على موضع أي صورة، سواء ظهرت أم لا، لفتح صور Google. اختر القطعة من اسمها المرقّم في القائمة أدناه فقط.","عکس‌های مرجع واقعی قطعات با شماره‌های مطابق فهرست انتخاب. برای بازکردن تصاویر گوگل روی محل هر عکس، چه نمایش داده شود چه نشود، بزنید. برای انتخاب قطعه فقط نام شماره‌دار آن را در فهرست پایین لمس کنید.","Osien aidot viitekuvat on numeroitu valintaluettelon mukaisesti. Avaa Google-kuvahaku napauttamalla kuvan aluetta riippumatta siitä, näkyykö kuva. Valitse osa vain napauttamalla sen numeroitua nimeä alla olevasta luettelosta."],"Tap any numbered photo card to search for that part on Google Images. To select a component for diagnosis, tap its numbered name below. Photos are general references, not model-specific diagrams.":["اضغط على أي صورة مرقمة للبحث عن القطعة في صور Google. لاختيار القطعة للتشخيص اضغط على اسمها المرقم أدناه. الصور مرجعية عامة وليست مخططات خاصة بالطراز.","برای جستجوی قطعه در تصاویر گوگل روی هر کارت عکس شماره‌دار بزنید. برای انتخاب قطعه جهت تشخیص، نام شماره‌دار آن را در پایین لمس کنید. عکس‌ها مرجع عمومی‌اند، نه نقشه‌های ویژه این مدل.","Napauta numeroitua kuvakorttia hakeaksesi osan Google-kuvahausta. Valitse osa diagnostiikkaa varten napauttamalla sen numeroitua nimeä alla. Kuvat ovat yleisiä viitekuvia, eivät mallikohtaisia kaavioita."],"Loading real photograph…":["جارٍ تحميل الصورة الحقيقية…","در حال بارگذاری عکس واقعی…","Ladataan aitoa valokuvaa…"],"Online reference photo":["صورة مرجعية من الإنترنت","عکس مرجع اینترنتی","Verkosta haettu viitekuva"],"I am not sure which component is faulty":["لست متأكداً من القطعة المعطلة","مطمئن نیستم کدام قطعه خراب است","En tiedä, mikä osa on viallinen"],"The diagnostic engine will show up to three candidate faults, based on evidence and known rules. It will not invent percentages of certainty.":["سيعرض محرك التشخيص حتى ثلاثة أعطال مرجحة وفق الأدلة والقواعد المعروفة، دون اختلاق نسب مئوية لليقين.","موتور تشخیص بر اساس شواهد و قواعد شناخته‌شده حداکثر سه عیب احتمالی را نمایش می‌دهد و درصد اطمینان ساختگی ارائه نمی‌کند.","Diagnostiikkamoottori näyttää havaintojen ja tunnettujen sääntöjen perusteella enintään kolme mahdollista vikaa. Se ei keksi varmuusprosentteja."],"When does it happen?":["متى يظهر العطل؟","عیب چه زمانی رخ می‌دهد؟","Milloin vika ilmenee?"],"Describe the fault in your own words":["صف العطل بكلماتك","عیب را با کلمات خود توصیف کنید","Kuvaile vika omin sanoin"],"Example: metallic rattling near rear of car, mainly over bumps":["مثال: خشخشة معدنية قرب مؤخرة السيارة، خاصة عند المطبات","مثال: صدای تق‌تق فلزی نزدیک عقب خودرو، به‌ویژه روی دست‌اندازها","Esimerkki: metallista kolinaa auton takaosasta, etenkin töyssyissä"],"Microphone — Audio Spectrum & Recording":["الميكروفون — طيف الصوت والتسجيل","میکروفون — طیف صدا و ضبط","Mikrofoni – äänispektri ja tallennus"],"Start Microphone":["تشغيل الميكروفون","روشن‌کردن میکروفون","Käynnistä mikrofoni"],"Camera / Image":["الكاميرا / الصورة","دوربین / تصویر","Kamera / kuva"],"Take a photo or select an existing image":["التقط صورة أو اختر صورة موجودة","عکس بگیرید یا تصویری موجود انتخاب کنید","Ota valokuva tai valitse olemassa oleva kuva"],"Image metadata saved":["حُفظت بيانات الصورة","اطلاعات تصویر ذخیره شد","Kuvan metatiedot tallennettu"],"Video Evidence":["دليل الفيديو","شواهد ویدئویی","Videohavainnot"],"Video is reviewed by the user, not automatically recognized as a fault.":["يراجع المستخدم الفيديو؛ ولا يتعرف البرنامج تلقائياً على العطل من الفيديو.","ویدئو توسط کاربر بررسی می‌شود؛ برنامه عیب را به‌طور خودکار از ویدئو شناسایی نمی‌کند.","Käyttäjä tarkistaa videon; ohjelma ei tunnista vikaa automaattisesti videosta."],"Motion Sensor — Vibration":["حساس الحركة — الاهتزاز","حسگر حرکت — لرزش","Liikeanturi – tärinä"],"Measure for 6 seconds":["قياس لمدة 6 ثوانٍ","اندازه‌گیری به مدت ۶ ثانیه","Mittaa 6 sekunnin ajan"],"No vibration measurement. Requires sensor support and permission.":["لم يُجرَ قياس الاهتزاز. يلزم دعم الحساس ومنح الإذن.","اندازه‌گیری لرزش انجام نشده است. پشتیبانی حسگر و مجوز لازم است.","Tärinää ei ole mitattu. Anturin tuki ja lupa tarvitaan."],"Keep phone safely on a stationary, accessible surface. Never place it inside an engine bay, near moving parts or on a hot / high-voltage component. Phone motion data is not calibrated industrial vibration measurement.":["ضع الهاتف بأمان على سطح ثابت يمكن الوصول إليه. لا تضعه داخل حجرة المحرك أو قرب الأجزاء المتحركة أو على جزء ساخن أو عالي الجهد. قياس حركة الهاتف ليس قياس اهتزاز صناعياً معايراً.","گوشی را ایمن روی سطح ثابت و در دسترس بگذارید. هرگز آن را در محفظه موتور، نزدیک قطعات متحرک یا روی قطعات داغ یا ولتاژ بالا قرار ندهید. داده حرکت گوشی اندازه‌گیری صنعتی کالیبره‌شده نیست.","Aseta puhelin turvallisesti vakaalle, helposti saavutettavalle pinnalle. Älä aseta sitä moottoritilaan, liikkuvien osien lähelle tai kuuman tai korkeajännitteisen osan päälle. Puhelimen liikedata ei ole kalibroitu teollinen tärinämittaus."],"Measured Temperature (°C)":["درجة الحرارة المقاسة (°C)","دمای اندازه‌گیری‌شده (°C)","Mitattu lämpötila (°C)"],"External measurement only":["قراءة من مقياس خارجي فقط","فقط اندازه‌گیری با ابزار بیرونی","Vain ulkoisella mittarilla mitattu"],"No audio recorded":["لم يُسجَّل صوت","صدایی ضبط نشده است","Ääntä ei ole tallennettu"],"Local rule-based fault ranking. This is ":["ترتيب الأعطال وفق قواعد هندسية محلية. هذا ","رتبه‌بندی عیب‌ها براساس قواعد محلی. این ","Vikojen järjestäminen paikallisten sääntöjen perusteella. Tämä "],"Insufficient evidence to produce a meaningful ranked list. Select a component or add symptoms and conditions.":["الأدلة غير كافية لترتيب الأعطال بشكل مفيد. اختر قطعة أو أضف أعراضاً وظروف ظهورها.","شواهد برای تهیه فهرست رتبه‌بندی‌شده کافی نیست. یک قطعه انتخاب یا علائم و شرایط را اضافه کنید.","Havainnot eivät riitä mielekkääseen vikojen järjestykseen. Valitse osa tai lisää oireita ja olosuhteita."],"If steering, brakes, airbag systems, vehicle control or high-voltage warnings are involved, avoid driving or attempting hazardous tests. Have a qualified professional assess the car.":["إذا تعلق العطل بالتوجيه أو الفرامل أو الوسائد الهوائية أو التحكم بالمركبة أو تحذيرات الجهد العالي، فتجنب القيادة والاختبارات الخطرة واستعن بفني مؤهل.","اگر مشکل به فرمان، ترمز، کیسه هوا، کنترل خودرو یا هشدارهای ولتاژ بالا مربوط است، از رانندگی و آزمون‌های خطرناک خودداری کرده و از متخصص کمک بگیرید.","Jos vika koskee ohjausta, jarruja, turvatyynyjä, ajonhallintaa tai korkeajännitevaroituksia, vältä ajamista ja vaarallisia testejä. Pyydä pätevää ammattilaista tarkastamaan auto."],"The software never diagnoses based on audio frequencies or pixel statistics alone: these measurements are descriptive and have not been calibrated against a labeled vehicle fault dataset.":["لا يشخّص البرنامج الأعطال من ترددات الصوت أو إحصاءات البكسلات وحدها؛ فهي قياسات وصفية لم تُعايَر مقابل بيانات أعطال سيارات موثقة.","برنامه فقط بر اساس فرکانس صدا یا آمار پیکسل عیب‌یابی نمی‌کند؛ این اندازه‌گیری‌ها توصیفی‌اند و با مجموعه داده برچسب‌دار عیوب خودرو کالیبره نشده‌اند.","Ohjelma ei tee vikadiagnoosia pelkkien äänitaajuuksien tai pikselitilastojen perusteella. Mittaukset ovat kuvailevia eikä niitä ole kalibroitu varmistetuilla vikahavainnoilla."],"Add evidence or symptoms":["إضافة أدلة أو أعراض","افزودن شواهد یا علائم","Lisää havaintoja tai oireita"],"Uses MyMemory free service, subject to availability, browser access and service limits. The selected report text may be transmitted to this service. Never send VIN or sensitive information without consent.":["تستخدم الترجمة خدمة MyMemory المجانية وفق توفرها وحدودها. قد يُرسل نص التقرير المختار إلى الخدمة. لا ترسل رقم الهيكل VIN أو معلومات حساسة دون موافقة.","ترجمه از سرویس رایگان MyMemory با محدودیت‌های دسترسی و استفاده بهره می‌گیرد. متن گزارش انتخاب‌شده ممکن است به این سرویس فرستاده شود. شماره VIN یا اطلاعات حساس را بدون رضایت ارسال نکنید.","Käännös käyttää maksutonta MyMemory-palvelua sen saatavuuden ja käyttörajojen puitteissa. Valittu raporttiteksti voidaan lähettää palveluun. Älä lähetä VIN-numeroa tai arkaluonteisia tietoja ilman suostumusta."],"After the repair, compare the same symptoms under safe, similar conditions. The software cannot certify roadworthiness.":["بعد الإصلاح قارن الأعراض نفسها في ظروف آمنة ومتشابهة. لا يستطيع البرنامج إثبات صلاحية السيارة للقيادة.","پس از تعمیر، علائم قبلی را در شرایط مشابه و ایمن مقایسه کنید. برنامه نمی‌تواند ایمنی تردد خودرو را تأیید کند.","Vertaa korjauksen jälkeen samoja oireita turvallisissa, samankaltaisissa olosuhteissa. Ohjelma ei voi todistaa ajokelpoisuutta."],"Before repair":["قبل الإصلاح","پیش از تعمیر","Ennen korjausta"],"Symptoms not recorded":["لم تُسجَّل الأعراض","علائم ثبت نشده‌اند","Oireita ei kirjattu"],"No earlier audio saved":["لا يوجد تسجيل صوت سابق محفوظ","صدای قبلی ذخیره نشده است","Aiemmin tallennettua ääntä ei ole"],"Repair / follow-up notes":["ملاحظات الإصلاح والمتابعة","یادداشت‌های تعمیر و پیگیری","Korjaus- ja seurantamerkinnät"],"What was repaired? Did the symptoms disappear?":["ما الذي أُصلح؟ هل اختفت الأعراض؟","چه چیزی تعمیر شد؟ آیا علائم برطرف شدند؟","Mitä korjattiin? Hävisivätkö oireet?"],"A quieter sound or disappearance of a warning is not proof that safety-critical systems are repaired. Professional verification may be required.":["انخفاض الصوت أو اختفاء التحذير لا يثبت إصلاح الأنظمة المؤثرة في السلامة؛ قد يلزم تحقق مهني.","کم‌شدن صدا یا ناپدیدشدن هشدار اثبات تعمیر سامانه‌های ایمنی نیست؛ بررسی متخصص ممکن است لازم باشد.","Hiljaisempi ääni tai varoituksen poistuminen ei todista turvallisuuskriittisen järjestelmän korjausta. Ammattilaisen tarkastus voi olla tarpeen."],"Save Verification Notes":["حفظ ملاحظات التحقق","ذخیره یادداشت‌های تأیید","Tallenna tarkistusmerkinnät"],"View Report":["عرض التقرير","نمایش گزارش","Näytä raportti"],"Powertrain Type":["نوع منظومة الدفع","نوع سامانه پیشرانه","Voimalinjan tyyppi"]});

Object.assign(UI_TRANSLATIONS,{"Runs in a mobile browser. No paid AI subscription. Diagnosis is rule-based; technical references use internet access.":["يعمل في متصفح الهاتف. لا يتطلب اشتراكاً مدفوعاً في الذكاء الاصطناعي. يعتمد التشخيص على قواعد هندسية، وتُستخدم شبكة الإنترنت للوصول إلى المراجع الفنية.","در مرورگر تلفن همراه اجرا می‌شود. به اشتراک پولی هوش مصنوعی نیاز ندارد. تشخیص عیب بر پایهٔ قواعد مهندسی است و برای دسترسی به منابع فنی از اینترنت استفاده می‌شود.","Toimii puhelimen selaimessa. Ei vaadi maksullista tekoälytilausta. Vianmääritys perustuu teknisiin sääntöihin, ja tekniset lähteet haetaan internetistä."],"No paid AI subscription.":["لا يلزم اشتراك مدفوع في الذكاء الاصطناعي.","به اشتراک پولی هوش مصنوعی نیاز نیست.","Maksullista tekoälytilausta ei tarvita."],"Diagnosis is rule-based; technical references use internet access.":["يعتمد التشخيص على قواعد هندسية، وتتطلب المراجع الفنية اتصالاً بالإنترنت.","تشخیص عیب بر پایهٔ قواعد مهندسی است و منابع فنی به اتصال اینترنت نیاز دارند.","Vianmääritys perustuu teknisiin sääntöihin; teknisten lähteiden käyttö edellyttää internetyhteyttä."],"Runs in a mobile browser.":["يعمل عبر متصفح الهاتف.","در مرورگر تلفن همراه اجرا می‌شود.","Toimii puhelimen selaimessa."],"Real component reference photographs, numbered to match the selection list. Tap any photograph to search Google Images.":["صور مرجعية حقيقية لأجزاء السيارة، مرقمة لتطابق قائمة الاختيار. اضغط على أي صورة للبحث عنها في صور Google.","عکس‌های مرجع واقعی قطعات خودرو با شماره‌هایی مطابق فهرست انتخاب نمایش داده می‌شوند. برای جست‌وجو در تصاویر گوگل روی هر عکس بزنید.","Osien aidot viitevalokuvat on numeroitu valintaluettelon mukaisesti. Avaa Google-kuvahaku napauttamalla valokuvaa."],"Reference photographs from external sources. They may not depict your exact car or show the precise component location. Open the credited source to inspect licensing and accuracy.":["صور مرجعية من مصادر خارجية؛ قد لا تمثل سيارتك بالضبط أو تُظهر الموضع الدقيق للقطعة. افتح المصدر المذكور للتحقق من الترخيص والدقة.","عکس‌های مرجع از منابع خارجی هستند و ممکن است دقیقاً خودروی شما یا محل دقیق قطعه را نشان ندهند. برای بررسی مجوز و درستی عکس، منبع ذکرشده را باز کنید.","Viitekuvat ovat ulkoisista lähteistä. Ne eivät välttämättä esitä juuri sinun autoasi tai osan tarkkaa sijaintia. Tarkista käyttöoikeus ja paikkansapitävyys ilmoitetusta lähteestä."],"Select a component, then tap Load Real Photos. Internet required.":["ابتدئ باختيار قطعة، ثم اضغط «تحميل الصور الحقيقية». يلزم الاتصال بالإنترنت.","ابتدا یک قطعه را انتخاب کنید و سپس «بارگیری عکس‌های واقعی» را بزنید. اتصال اینترنت لازم است.","Valitse osa ja napauta sitten ”Lataa aidot kuvat”. Internetyhteys tarvitaan."],"These are search/reference links, not pages read and verified by JSCD.":["هذه روابط بحث ومراجع، وليست صفحات قرأها JSCD وتحقق من محتواها.","این‌ها پیوندهای جست‌وجو و منابع مرجع هستند، نه صفحاتی که JSCD محتوای آن‌ها را خوانده و تأیید کرده باشد.","Nämä ovat haku- ja viitelinkkejä, eivät JSCD:n lukemia ja tarkistamia sivuja."],"Enter as much information as possible. Specific trims and engines must be verified before diagnosis.":["أدخل أكبر قدر ممكن من معلومات السيارة. يجب التحقق من الفئة التفصيلية والمحرك قبل التشخيص.","تا حد امکان اطلاعات خودرو را وارد کنید. تیپ دقیق خودرو و موتور باید پیش از تشخیص عیب بررسی شوند.","Anna mahdollisimman tarkat auton tiedot. Varusteversion ja moottorin tiedot on varmistettava ennen vianmääritystä."],"Select the area where you think the fault may be located. You do not need to know the exact faulty component.":["اختر المنطقة التي تعتقد أن العطل موجود فيها. لا يلزم أن تعرف القطعة المعطلة بدقة.","ناحیه‌ای را که گمان می‌کنید عیب در آن است انتخاب کنید. نیازی نیست قطعهٔ معیوب را دقیقاً بشناسید.","Valitse alue, jolla epäilet vian olevan. Sinun ei tarvitse tietää tarkkaa viallista osaa."],"Select the general area. You do not need to know the exact part.":["اختر المنطقة العامة؛ ليس ضرورياً أن تعرف القطعة الدقيقة.","ناحیهٔ کلی را انتخاب کنید؛ لازم نیست قطعهٔ دقیق را بدانید.","Val const combustionOnlyParts=/\b(crank(?:shaft)?|cam(?:shaft)?|piston|spark plug|glow plug|fuel injector|fuel pump|fuel filter|fuel tank|exhaust|muffler|catalytic|oxygen sensor|egr|dpf|gpf|alternator|starter motor|timing belt|timing chain|oil pump|oil filter|oil pan|intake manifold|throttle body|turbocharger|combustion|engine block|cylinder head)\b/i;
const evForbiddenWords=/\b(exhaust|muffler|tailpipe|catalytic converter|engine oil|fuel injector|gasoline leak|diesel leak)\b/i;
function ruleCompatible(rule){
 const definition=systems[rule.system];
 if(!definition||!definition.types.includes(s.type))return false;
 if(s.type==='ev' && (combustionOnlyParts.test(rule.title)||combustionOnlyParts.test(rule.part)||/belt issue|engine cooling fan/i.test(rule.title)))return false;
 if(s.type==='ice' && /(?:high.voltage|traction battery|bms|inverter|onboard charg|charging connector|ev drive motor|hybrid battery)/i.test(rule.title))return false;

}
function configurationIssues(){let issues=[];
 const make=(s.make||'').toLowerCase(),model=displayModel().toLowerCase(),year=Number(s.year);
 // Known strong contradiction; not a comprehensive global vehicle configuration database.
 if(s.type==='ev'&&make==='toyota'&&model==='corolla'&&year===2015)issues.push('Toyota Corolla 2015 is not a verified battery-electric production configuration. Check the actual vehicle powertrain and model before diagnosing.');
 if(s.type==='ev' && (systems[s.system]&&!systems[s.system].types.includes('ev')))issues.push('The selected system does not exist in a battery-electric powertrain. Select a compatible system.');
 if(s.type==='ev' && combustionOnlyParts.test(s.part||''))issues.push('The selected part belongs to a combustion-engine system and is incompatible with a fully electric vehicle.');
 if(s.type==='ev' && s.symptoms.some(x=>evForbiddenWords.test(x)))issues.push('A combustion-exhaust symptom was entered for a battery-electric vehicle. Remove or correct this symptom.');
 return issues;
}

function knownScore(rule){
 const selections=[...s.symptoms,...s.conditions].join(' ').toLowerCase();
 const free=(s.notes||'').toLowerCase();
 const all=(selections+' '+free+' '+(s.area||'')+' '+(s.part||'')).toLowerCase();
 let score=0,why=[],matchedTerms=[];
 if(s.system&&s.system!=='unknown'){
   if(rule.system===s.system){score+=3.5;why.push('Selected system');}
   else score-=3;
 }
 if(s.part&&s.part!=='Unknown / Not listed'){
   if(rule.part.toLowerCase()===s.part.toLowerCase()){score+=5;why.push('Selected component');}
   else if(rule.system===s.system)score+=0.5;
 }
 for(const t of rule.terms){
   let term=t.toLowerCase().trim();
   if(!term)continue;
   // Match complete phrases or distinct words, not arbitrary fragments.
   const escaped=term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   const matched=all.includes(term) && (term.includes(' ') || new RegExp('(^|[^a-z])'+escaped+'(?=$|[^a-z])','i').test(all));
   if(matched){score+=2;matchedTerms.push(term);why.push('Matching symptom: '+t)}
 }
 // Contradictory observations reduce ranking without prohibiting possible multiple faults.
 if(/no start/i.test(selections) && /(?:bumps|high speed|while braking)/i.test(rule.terms.join(' ')) && !matchedTerms.length)score-=1;
 if(/charging problem/i.test(selections) && !['charging','battery','hybrid','electrical','electronics'].includes(rule.system))score-=1.5;
 // Generic microphone and motion measurements are descriptive, not diagnoses.
 if(s.vibration&&matchedTerms.length&&/(vibration|knock|rattle|bearing|mount)/i.test(rule.title))score+=0.25;
 if(s.sound&&matchedTerms.length&&/(noise|rattle|bearing|loose|belt|squeal)/i.test(rule.title))score+=0.25;
 if(s.code&&/warning|control|sensor|battery/.test(rule.title.toLowerCase()))score+=0.5;
 if(!matchedTerms.length && (!s.part || rule.part.toLowerCase()!==s.part.toLowerCase()))score-=1;
 return {rule,score,why};
}
// Location uncertain: show only three candidates. A selected system or a specific component
// enables all sufficiently supported, compatible candidates (no arbitrary top-three cut).
function faultLocationUnknown(){return !s.system||s.system==='unknown'||(!s.part&&!systems[s.system]);}
function faultCategory(x){return x.score>=8?'primary':x.score>=5?'possible':'suspected';}
function faultIsHazardous(x){const r=rules[x.id];return /^(brakes|steering|safety|charging|hybrid)$/i.test(r.system)||/high.voltage|battery thermal|thermal runaway|brake|steering|tire defect|wheel bearing|coolant leak|exhaust leak/i.test(r.title);}

function analyze(){if(configurationIssues().length){s.analysis=[];return}let ranked=rules.filter(ruleCompatible).map(knownScore).sort((a,b)=>b.score-a.score);let matched=ranked.filter(x=>x.score>=2);if(matched.length===0){s.analysis=[];return}if(faultLocationUnknown())matched=matched.slice(0,3);s.analysis=matched.map(x=>({id:x.rule.id,score:x.score,why:x.why}));}

function reportHTML(){analyze();let a=s.analysis.map((x,i)=>{let r=rules[x.id];return '<div class="itemcard faultItem"><h3>'+(i+1)+'. '+esc(tr(r.title))+'</h3>'+faultClassMark(x)+faultSafetyNotice(x)+'<p><b>Evidence:</b> '+esc(tr(x.why.join('; ')||'System similarity'))+'</p><p><b>Verify safely:</b> '+esc(tr(r.verify))+'</p><p><b>Possible repair if confirmed:</b> '+esc(tr(r.repair))+'</p></div>'}).join('');return '<div class="results"><p class="reportTitle">JSCD Diagnostic Report</p><p class="sub muted">Generated: '+new Date().toLocaleString('en-GB')+' · Preliminary rule-based analysis</p><table><tbody>'+[['Vehicle',s.make+' '+displayModel()+' '+s.year],['Powertrain',s.type==='ev'?'Electric':s.type==='hybrid'?'Hybrid '+s.hybrid:'Fossil fuel '+s.fuel],['Engine / motor',s.type==='ev'?(s.power||'Unknown')+' kW':s.capacity+' L'],['Mileage',s.mileage?s.mileage+' km':'Not provided'],['Fault system / area',systems[s.system]?.name||s.area||'Unknown'],['Part',s.part||'Unspecified'],['Symptoms',s.symptoms.join('; ')||'Not given'],['Conditions',s.conditions.join('; ')||'Not given'],['Notes',s.notes||'—'],['OBD fault codes',s.code||'Not supplied'],['Temperature',s.temp?s.temp+' °C (user entered)':'Not measured'],['Audio evidence',s.sound?s.sound.summary:'Not supplied'],['Visual evidence',s.image?.stats?.summary||'Not supplied'],['Vibration evidence',s.vibration?.summary||'Not supplied']].map(x=>'<tr><th>'+esc(x[0])+'</th><td>'+esc(x[1])+'</td></tr>').join('')+'</tbody></table><h3 class="faultsHeading" style="margin-top:18px">'+esc(tr(faultLocationUnknown()?'Top 3 Possible Faults':'Relevant Possible Faults'))+'</h3>'+(a||'<p class="warn">Insufficient diagnostic evidence; no reliable candidate list.</p>')+'<p class="dangerbox"><b>Safety:</b> Do not attempt repairs on high-voltage batteries, airbags, pressurized systems, brakes or steering without appropriate training. Stop using the car if safety is in doubt.</p><p class="caption">A result is a hypothesis, not proof. Check vehicle function next(){leaveStep();if(s.step===1&&(!s.make||!s.year||!s.model||(s.model==='Other / Manual'&&!s.manualModel))){alert('Select a model or choose Other / Manual and enter the exact model name.');return}if(s.step===2&&!s.system){alert('Select a vehicle system or Unknown Fault Area.');return}if(s.step===3&&!s.part&&!s.area){alert('Select a component or general fault area.');return}if(s.step===8){save();alert('Session saved. Use New for a new diagnosis.');return}if(s.step===5){const issues=configurationIssues();if(issues.length){alert('Vehicle configuration conflict:\n'+issues.join('\n'));s.step=1;render();return}}s.step++;if(s.step===6)analyze();render()}function back(){leaveStep();if(s.step>0){s.step--;render()}}
function audioDraw(){if(!analyser)return;let arr=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(arr);const c=$('wave');if(!c)return;let x=c.getContext('2d');x.fillStyle='#071626';x.fillRect(0,0,c.width,c.height);let bars=95,w=c.width/bars;for(let i=0;i<bars;i++){let idx=Math.floor(i*arr.length/bars);let v=arr[idx]/255;x.fillStyle=i%3?'#24c6c8':'#e0b766';x.fillRect(i*w,c.height*(1-v),Math.max(2,w-1),c.height*v)}audioRAF=requestAnimationFrame(audioDraw)}
async function startAudio(){if(audioStream){return}if(!navigator.mediaDevices?.getUserMedia){alert('Microphone requires HTTPS and compatible browser.');return}try{audioStream=await navigator.mediaDevices.getUserMedia({audio:true});audioCtx=new (window.AudioContext||window.webkitAudioContext)();let source=audioCtx.createMediaStreamSource(audioStream);analyser=audioCtx.createAnalyser();analyser.fftSize=2048;source.connect(analyser);audioChunks=[];recorder=new MediaRecorder(audioStream);recorder.ondataavailable=e=>{if(e.data.size)audioChunks.push(e.data)};recorder.onstop=()=>{let blob=new Blob(audioChunks,{type:recorder.mimeType||'audio/webm'});if(s.sound?.url)URL.revokeObjectURL(s.sound.url);let url=URL.createObjectURL(blob);s.sound={url,summary:'Audio recorded · '+(blob.size/1024).toFixed(1)+' kB · browser FFT visualization (not fault classification)'};let el=$('playAudio');if(el){el.src=url;el.classList.remove('hide')}let label=$('audioStatus');if(label)label.textContent=s.sound.summary;save()};recorder.start();let t=$('audioStatus');if(t)t.textContent='Recording… Use Stop & Save when finished.';audioDraw()}catch(e){alert('Microphone unavailable or permission denied: '+e.message)}}
function stopAudio(){if(recorder?.state==='recording')recorder.stop();if(audioRAF)cancelAnimationFrame(audioRAF);audioRAF=null;audioStream?.getTracks().forEach(t=>t.stop());audioStream=null;audioCtx?.close().catch(()=>{});audioCtx=null;analyser=null}
async function processImage(file){if(!file)return;try{let url=URL.createObjectURL(file),img=new Image();await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url});let c=document.createElement('canvas'),scale=Math.min(1,512/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);let d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,lum=0,contrast=0,edges=0,arr=[];for(let i=0;i<d.length;i+=4){let v=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];lum+=v;arr.push(v)}let avg=lum/arr.length;for(let v of arr)contrast+=(v-avg)**2;let w=c.width;for(let y=1;y<c.height-1;y+=2)for(let x=1;x<w-1;x+=2){let i=y*w+x;edges+=Math.abs(arr[i]-arr[i+1])+Math.abs(arr[i]-arr[i+w])}let edgeCount=Math.ceil((c.height-2)/2)*Math.ceil((w-2)/2);let summary=`${img.width}×${img.height}px · Mean brightness ${(avg/255*100).toFixed(0)}% · contrast ${(Math.sqrt(contrast/arr.length)/255*100).toFixed(0)}% · edge variation ${(edges/Math.max(1,edgeCount)/510*100).toFixed(0)}%`;if(s.image?.url)URL.revokeObjectURL(s.image.url);s.image={name:file.name,url,stats:{summary}};$('imageResult').textContent=summary+' · These are image statistics, not automated crack detection.';$('preview').src=url;$('preview').classList.remove('hide');save()}catch(e){alert('Image could not be analyzed: '+e.message)}}
function stopVibe(){if(vibeHandler){window.removeEventListener('devicemotion',vibeHandler);vibeHandler=null}if(vibeSamples.length){let a=vibeSamples,mean=a.reduce((x,y)=>x+y,0)/a.length,rms=Math.sqrt(a.reduce((x,y)=>x+(y-mean)**2,0)/a.length);s.vibration={summary:`${a.length} samples · relative dynamic acceleration RMS ${rms.toFixed(3)} m/s² (uncalibrated)`};}let v=$('vibeStatus');if(v)v.textContent=s.vibration?.summary||'No motion data received. Your browser/device might block sensors.';save()}
async function startVibe(){vibeSamples=[];if(!('DeviceMotionEvent' in window)){alert('This device/browser does not expose the Motion Sensor API.');return}try{if(typeof DeviceMotionEvent.requestPermission==='function'){const perm=await DeviceMotionEvent.requestPermission();if(perm!=='granted'){alert('Motion sensor permission was denied.');return}}vibeHandler=e=>{let d=e.acceleration||e.accelerationIncludingGravity;if(d&&[d.x,d.y,d.z].some(Number.isFinite)){vibeSamples.push(Math.hypot(d.x||0,d.y||0,d.z||0));if(vibeSamples.length>4000)vibeSamples.shift()}};window.addEventListener('devicemotion',vibeHandler);$('vibeStatus').textContent='Collecting motion data for 6 seconds…';setTimeout(()=>{if(vibeHandler)stopVibe()},6000)}catch(e){alert('Motion sensor unavailable: '+e.message)}}
function bindEvidence(){$('startAudio').onclick=startAudio;$('stopAudio').onclick=stopAudio;$('photoInput').onchange=e=>processImage(e.target.files?.[0]);$('videoInput').onchange=e=>{let f=e.target.files?.[0];if(f){s.video={name:f.name};$('videoResult').textContent=f.name+' · video saved only in current browser session.'}};$('startVibe').onclick=startVibe;$('stopVibe').onclick=stopVibe}
function exportReport(){let content='<!doctype html><html><head><meta charset="utf-8"><title>JSCD Report</title><style>body{max-width:760px;margin:25px auto;font:15px Arial;line-height:1.5;padding:10px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:8px;text-align:left}.itemcard{border:1px solid #ddd;padding:12px;margin:8px 0}.dangerbox{background:#ffe2e2;padding:12px}.interfaceLanguages{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px}.interfaceLanguages button{color:#f1f7fa;background:#19364d;border:1px solid #52748a;border-radius:9px;padding:7px 10px;min-height:39px;flex:1}.interfaceLanguages button.active{border-color:#f3c36e;background:#65502a}.localizedRTL{direction:rtl;text-align:right}.localizedRTL .choice{text-align:right}.localizedRTL .number{margin-left:7px;margin-right:0}.localizedRTL .results th,.localizedRTL .results td{text-align:right}.localizedRTL .check{direction:rtl}.localizedRTL input,.localizedRTL textarea{direction:auto;text-align:start}.localizedRTL .photoLabel{text-align:right}.interfaceLanguages{direction:ltr}</style></head><body>'+reportHTML()+'<h2>External references</h2>'+refLinks().map(x=>'<p><a href="'+esc(x.url)+'">'+esc(x.name)+'</a></p>').join('')+'<p>Designer: Jalal Albadri · October 2026</p></body></html>';download('JSCD_Diagnostic_Report.html',new Blob([content],{type:'text/html;charset=utf-8'}))}
function download(name,blob){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function reportPlain(){analyze();let primary=s.analysis.map((x,i)=>{let r=rules[x.id];return (i+1)+'. '+r.title+'; Evidence: '+x.why.join(', ')+'; Verify: '+r.verify+'; Possible repair: '+r.repair}).join('\n');return `JSCD preliminary diagnostic report. Vehicle: ${s.make} ${displayModel()} ${s.year}; Powertrain: ${s.fuel}; Area: ${systems[s.system]?.name||s.area}; Part: ${s.part}; Symptoms: ${s.symptoms.join(', ')}; Notes: ${s.notes}. Top fault hypotheses: ${primary}. IMPORTANT: Unverified hypotheses, professional checks may be required.`}
async function translateReport(){let target=$('targetLang').value;s.lang=target;let box=$('translatedReport');box.innerHTML='<p class="info">Connecting to free translation service…</p>';let txt=reportPlain();if(s.vin){} // VIN is intentionally excluded from translation payload.
try{if(!navigator.onLine)throw Error('Offline');let chunks=txt.match(/.{1,420}(?:\s|$)/gs)||[txt],translated=[];for(let chunk of chunks){let url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(chunk.trim())+'&langpair=en%7C'+encodeURIComponent(target);let ctrl=new AbortController();let timeout=setTimeout(()=>ctrl.abort(),12000);let resp;try{resp=await fetch(url,{signal:ctrl.signal})}finally{clearTimeout(timeout)}if(!resp.ok)throw Error('HTTP '+resp.status);let json=await resp.json();if(!json.responseData?.translatedText||Number(json.responseStatus)>=400)throw Error(json.responseDetails||'Translation not available');translated.push(json.responseData.translatedText)}box.innerHTML='<div class="itemcard '+(['ar','fa'].includes(target)?'rtl':'')+'"><h3>Translated Report ('+esc(target)+')</h3><p style="white-space:pre-wrap">'+esc(translated.join(' '))+'</p><p class="caption">Machine translation may contain technical errors. The original English report remains authoritative.</p></div>'}catch(e){box.innerHTML='<div class="warn">Online translation unavailable: '+esc(e.message)+'. No subscription is needed; try again later. The English report remains available.</div>'}}
const guide={en:`<h3>Purpose and scope</h3><p><b>Jalal Smart Car Diagnostic (JSCD)</b> is a preliminary rule-based engineering diagnostic assistant for passenger cars powered by combustion engines, hybrid systems or electric drive. It runs as a single HTML/JavaScript file in a phone browser. It is <b>not connected to a general-purpose artificial intelligence system</b>: using such a service could require a paid subscription or API. AI integration may be developed in the future if a suitable service or local model becomes available. No paid AI service is needed to operate this version.</p>
<h3>Step-by-step inspection</h3><ol><li><b>Powertrain:</b> select Fossil Fuel, Hybrid or Electric. This determines which systems and fault rules are applicable.</li><li><b>Vehicle:</b> choose manufacturer, model, year, fuel, engine capacity or electrical specifications. For an unlisted model choose Other / Manual and enter its name.</li><li><b>Suspected fault location:</b> choose the system where you believe the fault originates. Select a component by its <b>numbered name in the list</b>. If uncertain, use Unknown Fault Area; the system then displays at most three supported hypotheses.</li><li><b>Real component photos:</b> thumbnails are references, not guaranteed images of your exact model. Tap an image area to open Google Images for that component; use the <b>part name below the image</b> to select it for diagnosis.</li><li><b>Symptoms and conditions:</b> select only what you observe (noise, vibration, warning lights, leakage, loss of power) and when it happens (while braking, over bumps, when hot, during acceleration or charging). Add written notes.</li><li><b>Evidence:</b> optionally capture photos, audio, video and motion data or enter measured temperature and OBD fault codes. Grant browser permissions when prompted. These are optional; the tool may not support every phone or sensor.</li><li><b>Analysis:</b> continue with Next/Diagnose. The program compares observations with built-in fault rules. If the area is known, it can show all relevant rule-based faults; when location is unknown it shows only the top three.</li><li><b>Report:</b> read the suspected causes, supporting evidence, safe verification methods, possible repairs after confirmation and safety warnings. Print or save the report and open external repair/video searches. Online links are not automatically checked or endorsed.</li><li><b>After repair:</b> use Repair Verification to compare symptoms and add follow-up observations; this does not certify that the car is safe.</li></ol>
<h3>Diagnostic colors and labels</h3><p><b style="color:#75d9a8">Green — Primary:</b> best supported by current evidence, not a confirmed defect.<br><b style="color:#94c4ff">Blue — Possible:</b> some supporting evidence; further checks needed.<br><b style="color:#ffd18c">Orange — Suspected:</b> preliminary or weak evidence.<br><b style="color:#ff9b92">Red — Dangerous / safety warning:</b> safety-critical risk requiring prompt caution or professional inspection. <b>Danger is distinct from likelihood</b>; a red warning does not establish that the fault exists.</p>
<h3>Buttons and navigation</h3><p><b>English / العربية / فارسی / Suomi:</b> change the interface language. <b>Guide:</b> open instructions; the three language choices in this guide switch its text. <b>About:</b> project information. <b>Save Session:</b> preserve supported text data in this browser, not all media. <b>New:</b> clear the current inspection. <b>Back / Next:</b> move between stages. <b>Load Real Photos:</b> request online image references. <b>Diagnose:</b> generate rule-based hypotheses. <b>Print / PDF, Save HTML Report:</b> produce report copies. <b>Translate Online:</b> request optional third-party translation. <b>×:</b> close the dialog.</p>
<h3>Reliability, internet and safety</h3><p>The microphone displays acoustic characteristics, the camera captures images and basic visual features, and motion sensors may report acceleration; none alone identify an automotive fault reliably. Results depend on the inputs and the limited local fault database. Internet services can fail or restrict access. A photograph may depict a similar but different vehicle; confirm model-specific data independently. Never inspect live high-voltage cables, airbags, moving parts or hot exhaust. Do not drive with suspected serious brake, steering or safety faults. Ask a qualified technician to verify diagnosis and repairs.</p>`,ar:`<h3>الهدف ونطاق البرنامج</h3><p><b>نظام جلال الذكي لتشخيص أعطال السيارات (JSCD)</b> مساعد هندسي أولي يعتمد على قواعد تشخيصية للسيارات الشخصية ذات محركات الاحتراق أو المنظومات الهجينة أو الكهربائية. يعمل من ملف HTML وJavaScript واحد في متصفح الهاتف. <b>لا يرتبط البرنامج حالياً بمحرك ذكاء اصطناعي عام</b>؛ فقد يتطلب ربط خدمات الذكاء الاصطناعي اشتراكاً أو واجهة مدفوعة. يمكن تطويره وربطه بالذكاء الاصطناعي مستقبلاً إذا توفرت وسيلة مناسبة، دون أن يكون ذلك شرطاً لتشغيل هذه النسخة.</p>
<h3>طريقة الفحص خطوة بخطوة</h3><ol><li><b>نوع منظومة الدفع:</b> اختر سيارة احتراق أو هجينة أو كهربائية؛ لتظهر الأنظمة والأعطال المتوافقة معها.</li><li><b>بيانات السيارة:</b> اختر الشركة والطراز والسنة والوقود وسعة المحرك أو مواصفات الدفع الكهربائي. إذا لم يوجد الطراز اختر «أخرى / إدخال يدوي».</li><li><b>موقع العطل المشتبه به:</b> اختر النظام الذي تتوقع وجود الخلل فيه، ثم حدد القطعة من <b>اسمها المرقم في القائمة</b>. إذا لم تعرف المكان اختر «موقع عطل غير معروف»، فيعرض البرنامج ثلاثة أعطال كحد أقصى.</li><li><b>صور الأجزاء:</b> الصور مرجعية وقد لا تخص طراز سيارتك تحديداً. الضغط على مكان الصورة يفتح بحث صور Google للجزء؛ أما <b>اختيار القطعة فيكون بالضغط على اسمها</b> أسفل الصور.</li><li><b>الأعراض وظروف حدوثها:</b> اختر الأعراض التي شاهدتها فعلاً، مثل الصوت والاهتزاز والتسرب والتحذيرات وضعف القدرة، وحدد هل تظهر عند المطبات أو الفرملة أو التسارع أو السخونة أو الشحن، ثم اكتب ملاحظاتك.</li><li><b>جمع الأدلة:</b> يمكنك استعمال الكاميرا والميكروفون والفيديو وحساس الحركة أو إدخال الحرارة المقاسة ورموز أعطال OBD. هذه الأدوات اختيارية وتحتاج بعضها إلى أذونات المتصفح، وقد لا تعمل على كل هاتف.</li><li><b>التحليل:</b> اضغط التالي/تشخيص ليقارن البرنامج المعطيات بقواعد الأعطال. عند تحديد المنطقة تُعرض الأعطال ذات الصلة، وعند عدم معرفة المنطقة تظهر أبرز ثلاثة فقط.</li><li><b>التقرير:</b> اقرأ أسباب الأعطال والأدلة المؤيدة وطريقة التحقق الآمن والإصلاح الممكن بعد التأكد والتحذيرات. يمكن حفظ التقرير أو طباعته وفتح روابط البحث عن الإصلاح والفيديوهات، دون اعتبار تلك الروابط مصادر تم التحقق منها آلياً.</li><li><b>التحقق بعد الإصلاح:</b> قارن الأعراض قبل الإصلاح وبعده وسجّل النتيجة؛ وهذا لا يُعد شهادة بسلامة السيارة.</li></ol>
<h3>معنى ألوان الأعطال</h3><p><b style="color:#75d9a8">الأخضر — الأعطال الأساسية:</b> الأكثر توافقاً مع الأدلة، لكنها غير مؤكدة.<br><b style="color:#94c4ff">الأزرق — الأعطال الممكنة:</b> تدعمها بعض الأدلة وتحتاج إلى فحص.<br><b style="color:#ffd18c">البرتقالي — الأعطال المشتبه بها:</b> أدلتها قليلة أو أولية.<br><b style="color:#ff9b92">الأحمر — الأخطار والتحذيرات:</b> مشكلات قد تؤثر في السلامة وتستوجب الحذر أو الفحص المختص؛ <b>الخطورة لا تعني أن العطل مؤكد أو الأكثر احتمالاً</b>.</p>
<h3>وظائف الأزرار</h3><p><b>أزرار اللغات:</b> تغيير لغة الواجهة. <b>Guide:</b> فتح هذا الدليل وتغيير لغته من أزراره العلوية. <b>About:</b> حول المشروع. <b>Save Session:</b> حفظ البيانات النصية المدعومة في المتصفح، وليس جميع ملفات الوسائط. <b>New:</b> بدء فحص جديد. <b>Back / Next:</b> التنقل بين المراحل. <b>Load Real Photos:</b> تحميل صور مرجعية عبر الإنترنت. <b>Diagnose:</b> عرض فرضيات التشخيص. <b>Print / PDF وSave HTML Report:</b> طباعة التقرير أو حفظه. <b>Translate Online:</b> ترجمة اختيارية عبر خدمة خارجية. <b>×:</b> إغلاق النافذة.</p>
<h3>حدود التشخيص والتحذيرات</h3><p>الصوت والصورة والاهتزاز قياسات مساعدة ولا تؤكد وحدها وجود عطل. تعتمد النتائج على البيانات المدخلة وقاعدة المعرفة المحلية المحدودة. قد تفشل خدمات الإنترنت أو لا تتوفر صورة مطابقة للطراز. لا تلمس كابلات الجهد العالي أو الوسائد الهوائية أو الأجزاء الدوارة أو العادم الساخن، ولا تقد سيارة يُشتبه بوجود خلل خطير في فراملها أو توجيهها. يجب التحقق من النتائج والإصلاحات بواسطة فني مؤهل.</p>`,fa:`<h3>هدف و محدوده برنامه</h3><p><b>سامانه تشخیص عیب خودروی جلال (JSCD)</b> یک ابزار مقدماتی مبتنی بر قواعد مهندسی برای خودروهای سواری احتراقی، هیبریدی و تمام‌برقی است. در مرورگر تلفن و از یک فایل HTML و JavaScript اجرا می‌شود. این نسخه <b>به مدل هوش مصنوعی عمومی متصل نیست</b>؛ اتصال به چنین خدماتی ممکن است نیازمند اشتراک یا API پولی باشد. در آینده می‌توان آن را با روش مناسب به سامانه هوش مصنوعی پیوند داد؛ این کار برای استفاده از نسخه کنونی ضروری نیست.</p>
<h3>مراحل بررسی</h3><ol><li><b>نوع پیشرانه:</b> احتراقی، هیبریدی یا برقی را انتخاب کنید تا فقط سامانه‌های سازگار نمایش داده شوند.</li><li><b>اطلاعات خودرو:</b> سازنده، مدل، سال، سوخت، حجم موتور یا مشخصات الکتریکی را انتخاب کنید؛ برای مدل ناموجود گزینه «سایر / دستی» را بزنید.</li><li><b>محل احتمالی عیب:</b> سامانه و سپس قطعه را از <b>نام شماره‌دار آن در فهرست</b> انتخاب کنید. اگر محل را نمی‌دانید، گزینه محل نامشخص را انتخاب کنید؛ حداکثر سه عیب نمایش داده می‌شود.</li><li><b>عکس قطعات:</b> تصویرها مرجع عمومی‌اند و ممکن است دقیقاً متعلق به مدل خودروی شما نباشند. لمس ناحیه عکس جستجوی تصاویر Google را باز می‌کند؛ <b>برای انتخاب قطعه روی نام آن در فهرست بزنید</b>.</li><li><b>علائم و شرایط:</b> نشانه‌های واقعی مانند صدا، لرزش، نشتی، چراغ هشدار یا افت توان را انتخاب کنید؛ زمان وقوع مانند ترمز، دست‌انداز، شتاب، گرما یا شارژ را نیز مشخص کنید.</li><li><b>ثبت شواهد:</b> استفاده از دوربین، میکروفون، ویدئو و حسگر حرکت اختیاری است؛ می‌توانید دمای اندازه‌گیری‌شده و کد OBD را هم وارد کنید. برخی امکانات به اجازه مرورگر و پشتیبانی تلفن نیاز دارند.</li><li><b>تحلیل:</b> با «بعدی / تشخیص» نشانه‌ها با قواعد عیب مقایسه می‌شوند. برای محل مشخص، همه عیب‌های مرتبط؛ و برای محل نامشخص فقط سه عیب نخست نشان داده می‌شود.</li><li><b>گزارش:</b> علت‌های احتمالی، شواهد، روش بررسی ایمن، تعمیر پس از تأیید و هشدارها را بخوانید. گزارش را ذخیره یا چاپ کنید و در صورت نیاز پیوندهای جستجوی تعمیر و ویدئو را باز کنید؛ محتوای آن‌ها به‌صورت خودکار تأیید نشده است.</li><li><b>پس از تعمیر:</b> علائم پیش و پس از تعمیر را مقایسه کنید؛ این بررسی گواهی ایمنی خودرو نیست.</li></ol>
<h3>معنای رنگ‌ها</h3><p><b style="color:#75d9a8">سبز — عیب‌های اصلی:</b> بیشترین پشتیبانی از شواهد، بدون تأیید قطعی.<br><b style="color:#94c4ff">آبی — عیب‌های ممکن:</b> دارای برخی شواهد و نیازمند بررسی بیشتر.<br><b style="color:#ffd18c">نارنجی — عیب‌های مشکوک:</b> شواهد محدود یا مقدماتی.<br><b style="color:#ff9b92">قرمز — هشدار خطر:</b> احتمال خطر ایمنی و نیاز به احتیاط یا بررسی متخصص؛ <b>شدت خطر با احتمال وقوع عیب یکسان نیست</b>.</p>
<h3>کار دکمه‌ها</h3><p><b>دکمه‌های زبان:</b> تغییر زبان رابط. <b>Guide:</b> باز کردن راهنما و انتخاب زبان آن. <b>About:</b> درباره پروژه. <b>Save Session:</b> ذخیره داده‌های متنی در مرورگر، نه همه فایل‌های رسانه‌ای. <b>New:</b> شروع بررسی تازه. <b>Back / Next:</b> جابه‌جایی مراحل. <b>Load Real Photos:</b> دریافت تصاویر مرجع از اینترنت. <b>Diagnose:</b> نمایش عیب‌های احتمالی. <b>Print / PDF و Save HTML Report:</b> چاپ و ذخیره گزارش. <b>Translate Online:</b> ترجمه اختیاری آنلاین. <b>×:</b> بستن پنجره.</p>
<h3>محدودیت‌ها و ایمنی</h3><p>صدا، تصویر و لرزش به‌تنهایی علت عیب را مشخص نمی‌کنند. نتیجه به داده‌های کاربر و پایگاه محدود قواعد بستگی دارد. خدمات اینترنتی ممکن است کار نکنند یا عکس مناسب در دسترس نباشد. به سیم‌های ولتاژ بالا، کیسه هوا، قطعات چرخان یا اگزوز داغ دست نزنید. با احتمال خرابی جدی ترمز یا فرمان رانندگی نکنید. تشخیص و تعمیر باید توسط متخصص تأیید شود.</p>`,fi:`<h3>Tarkoitus ja soveltamisala</h3><p><b>Jalal Smart Car Diagnostic (JSCD)</b> on sääntöpohjainen, alustava tekninen vianmääritystyökalu polttomoottori-, hybridi- ja täyssähköhenkilöautoille. Se toimii puhelimen selaimessa yhtenä HTML/JavaScript-tiedostona. Ohjelma <b>ei ole yhteydessä yleiskäyttöiseen tekoälymalliin</b>: tällainen yhteys saattaa edellyttää maksullista tilausta tai rajapintaa. Tekoälyintegraatio voidaan kehittää myöhemmin sopivalla menetelmällä; nykyinen versio ei vaadi maksullista tekoälyä.</p>
<h3>Tarkastus vaiheittain</h3><ol><li><b>Voimalinjan tyyppi:</b> valitse polttomoottori-, hybridi- tai sähköauto, jotta sopivat järjestelmät ja viat tulevat näkyviin.</li><li><b>Auton tiedot:</b> valitse merkki, malli, vuosimalli, polttoaine ja moottorin koko tai sähköiset tekniset tiedot. Puuttuvalle mallille käytä kohtaa Muu / käsin.</li><li><b>Epäilty vikakohde:</b> valitse järjestelmä ja osa <b>numeroidun nimiluettelon</b> avulla. Jos sijainti ei ole tiedossa, käytä tuntemattoman vikakohdan valintaa; tuloksia näytetään enintään kolme.</li><li><b>Osakuvat:</b> kuvat ovat yleisiä vertailukuvia eivätkä välttämättä vastaa tarkkaa automallia. Kuvan napautus avaa Google-kuvahaun. <b>Valitse osa kuvan alapuolisesta nimiluettelosta</b>.</li><li><b>Oireet ja olosuhteet:</b> valitse todelliset oireet, kuten melu, tärinä, vuoto, varoitusvalo tai tehon lasku. Merkitse, ilmeneekö ongelma jarrutettaessa, töyssyissä, kiihdytettäessä, kuumana tai ladattaessa, ja kirjoita lisätiedot.</li><li><b>Havaintojen kerääminen:</b> kamera, mikrofoni, video ja liikeanturi ovat valinnaisia. Voit lisätä mitatun lämpötilan tai OBD-vikakoodit. Selainluvat ja anturituki vaihtelevat.</li><li><b>Analyysi:</b> valitse Seuraava / Diagnose. Ohjelma vertailee oireita sisäisiin sääntöihin. Tunnetusta vikakohdasta näytetään kaikki olennaiset sääntöosumat; tuntemattomasta enintään kolme.</li><li><b>Raportti:</b> tarkista mahdolliset syyt, niitä tukevat havainnot, turvalliset varmistuskeinot, vahvistuksen jälkeiset korjaussuositukset ja varoitukset. Voit tallentaa tai tulostaa raportin ja avata korjaus- ja videohaut; niiden sisältöä ei tarkisteta automaattisesti.</li><li><b>Korjauksen jälkeen:</b> vertaa aiempia ja uusia oireita ja merkitse tulos. Tämä ei todista auton olevan turvallinen.</li></ol>
<h3>Värien ja luokkien merkitys</h3><p><b style="color:#75d9a8">Vihreä — Ensisijaiset viat:</b> eniten havaintotukea, ei vahvistettua diagnoosia.<br><b style="color:#94c4ff">Sininen — Mahdolliset viat:</b> osittaista tukea, lisätarkistus tarpeen.<br><b style="color:#ffd18c">Oranssi — Epäillyt viat:</b> alustavaa tai vähäistä näyttöä.<br><b style="color:#ff9b92">Punainen — Vaaratilannevaroitus:</b> turvallisuusriski, joka vaatii varovaisuutta tai ammattilaisen tarkastusta; <b>vaara ei ole sama asia kuin vian todennäköisyys</b>.</p>
<h3>Painikkeiden toiminnot</h3><p><b>Kielipainikkeet:</b> vaihtavat käyttöliittymän kielen. <b>Guide:</b> avaa oppaan ja sen kielivalinnan. <b>About:</b> hankkeen tiedot. <b>Save Session:</b> tallentaa tuetut tekstit selaimeen, ei kaikkia mediatiedostoja. <b>New:</b> aloittaa uuden tarkastuksen. <b>Back / Next:</b> siirtävät vaiheesta toiseen. <b>Load Real Photos:</b> hakee vertailukuvia verkosta. <b>Diagnose:</b> näyttää vikaehdotukset. <b>Print / PDF ja Save HTML Report:</b> tulostavat tai tallentavat raportin. <b>Translate Online:</b> valinnainen verkkokäännös. <b>×:</b> sulkee ikkunan.</p>
<h3>Rajoitukset ja varoitukset</h3><p>Ääni-, kuva- ja tärinäanalyysi ei yksin varmista vikaa. Tulokset riippuvat syötteistä ja rajallisesta paikallisesta tietokannasta. Verkkopalvelut voivat olla saavuttamattomia, ja valokuva voi esittää eri automallia. Älä koske korkeajännitekaapeleihin, turvatyynyihin, pyöriviin osiin tai kuumaan pakoputkeen. Älä aja autolla, jos epäilet vakavaa jarru- tai ohjausvikaa. Anna pätevän ammattilaisen varmistaa diagnoosi ja korjaus.</p>`};
